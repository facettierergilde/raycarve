<!doctype html>
<html lang="de" data-lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RayCarve – Handbuch / Manual</title>

  <meta name="site-root" content="../">
  <meta name="theme-color" content="#0b0f18">
  <link rel="icon" href="../assets/gem.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../assets/style.css">
  <script>
    (function () {
      var l = new URLSearchParams(location.search).get("lang");
      try { l = l || localStorage.getItem("raycarve-lang"); } catch (e) {}
      if (l !== "de" && l !== "en") l = /^de\b/i.test(navigator.language || "") ? "de" : "en";
      document.documentElement.setAttribute("data-lang", l);
      document.documentElement.setAttribute("lang", l);
    })();
  </script>
</head>
<body>

<header class="site-header">
  <div class="wrap nav">
    <a class="brand" href="../"><img src="../assets/gem.svg" alt="" width="28" height="28">RayCarve</a>
    <nav class="nav-links" aria-label="Main">
      <a href="../#features"><span data-l="de">Funktionen</span><span data-l="en">Features</span></a>
      <a href="../#download">Download</a>

    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-set-lang="de" aria-pressed="false"><span>DE</span></button>
      <button type="button" data-set-lang="en" aria-pressed="false"><span>EN</span></button>
    </div>
  </div>
</header>

  </div>
</div>

<div class="wrap">
  <p class="notice" id="version-notice" hidden></p>
  <div class="manual-layout">
    <nav class="toc" aria-label="Contents">
      <details open>
        <summary><span data-l="de">Inhalt</span><span data-l="en">Contents</span></summary>
        <ul id="toc-list"></ul>
      </details>
    </nav>
    <article class="doc" id="doc">

</div>

<footer class="site-footer">
